<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Lifespan & Telemetry Dashboard | G-Track</title>
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Base App Styles for Navbar & Sidebar Consistency -->
    <link rel="stylesheet" href="../../dashboard/style(admin).css?v=20261021_1">
    
    <!-- Isolated Predictive Analytics Stylesheet -->
    <link rel="stylesheet" href="predictiveAnalytics.css?v=20261021_1">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Standalone Page Layout Adapters */
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .standalone-shell {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px);
            overflow: hidden;
        }
        .standalone-sidebar {
            width: 240px;
            background: rgba(11, 15, 25, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            gap: 6px;
        }
        .standalone-main {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            background: #0b0f19;
        }
        .standalone-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .standalone-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }
        .standalone-link.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .standalone-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- Unified Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-box">
                <img src="../../dashboard/logo.png" alt="G-Track Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="brand-text">
                <span class="brand-title">G-TRACK</span>
                <span class="brand-subtitle">Municipal Asset Intelligence</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../../dashboard/admin.html" class="pa-btn" style="text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Return to Admin Dashboard
            </a>
        </div>
    </header>

    <!-- Shell Container -->
    <div class="standalone-shell">
        <!-- Sidebar Navigation -->
        <aside class="standalone-sidebar">
            <a href="../../dashboard/admin.html" class="standalone-link">
                <i class="fas fa-home"></i> <span>Dashboard Home</span>
            </a>
            <a href="../../dashboard/admin.html" class="standalone-link">
                <i class="fas fa-table-list"></i> <span>Masterlist</span>
            </a>
            <a href="../../dashboard/admin.html" class="standalone-link">
                <i class="fas fa-chart-pie"></i> <span>Asset Analytics</span>
            </a>
            <hr class="standalone-divider">
            <a href="index.html" class="standalone-link active">
                <i class="fas fa-brain"></i> <span>Predictive Lifespan</span>
            </a>
            <hr class="standalone-divider">
            <a href="../../dashboard/admin.html" class="standalone-link">
                <i class="fas fa-bell"></i> <span>Notifications</span>
            </a>
        </aside>

        <!-- Main Content Area -->
        <main class="standalone-main" id="predictive-analytics-root">
            <!-- Predictive Lifespan Dashboard dynamically mounts here -->
        </main>
    </div>

    <!-- Predictive Analytics Scripts -->
    <script src="predictiveAnalyticsService.js?v=20261021_1"></script>
    <script src="predictiveAnalyticsView.js?v=20261021_1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.PredictiveAnalyticsModule) {
                window.PredictiveAnalyticsModule.mount('predictive-analytics-root');
            }
        });
    </script>
</body>
</html>
